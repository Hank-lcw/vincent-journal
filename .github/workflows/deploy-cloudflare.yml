name: Deploy VINCENT JOURNAL to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vincent-journal-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Repository QA
        run: npm run qa

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Check Cloudflare deploy configuration
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured yet; typecheck passed and deploy steps will be skipped."
          fi

      - name: Deploy Worker + Static Assets
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx wrangler deploy

      - name: Apply D1 migrations
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: Production smoke test
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          PUBLIC_BASE_URL: https://vincent-journal.andyhank1234567890.workers.dev
        run: npm run smoke
